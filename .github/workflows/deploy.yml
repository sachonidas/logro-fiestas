name: Deploy backend

# El frontend se despliega solo en Vercel; aquí solo viaja el backend al VPS.
on:
    push:
        branches: [main]
        paths:
            - 'backend/**'
            - 'docker-compose.prod.yml'
            - '.github/workflows/deploy.yml'
    workflow_dispatch:

concurrency:
    group: deploy-logro-fiestas
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            - run: npx tsc --noEmit
            - run: npm test

    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            # Hasta que el VPS esté configurado (docs/deploy.md §5) los secrets no
            # existen; en ese caso el job termina en verde sin desplegar.
            - name: Check deploy configuration
              id: cfg
              run: |
                  if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then
                      echo "skip=true" >> "$GITHUB_OUTPUT"
                      echo "::notice::DEPLOY_HOST no está configurado; se omite el despliegue."
                  fi

            - name: Deploy over SSH
              if: steps.cfg.outputs.skip != 'true'
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  script: |
                      set -euo pipefail
                      cd /opt/logro-fiestas
                      git fetch origin main
                      git reset --hard origin/main
                      C="docker compose --env-file .env.prod -f docker-compose.prod.yml"
                      $C up -d --build --remove-orphans
                      # El esquema es todo CREATE ... IF NOT EXISTS: se puede reaplicar.
                      $C exec -T database psql -v ON_ERROR_STOP=1 -U fiestas -d fiestas \
                        < backend/migrations/001_create_events.sql
                      docker image prune -f
