name: Deploy backend

# El frontend se despliega solo en Vercel; aquí solo viaja el backend al VPS.
on:
    push:
        branches: [main]
        paths:
            - 'backend/**'
            - 'docker-compose.prod.yml'
            - '.github/workflows/deploy.yml'
    workflow_dispatch:

concurrency:
    group: deploy-logro-fiestas
    cancel-in-progress: false

jobs:
    test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend

        # queries.test.ts es un test de integración: inserta y borra de verdad.
        # La misma versión que corre en el VPS.
        services:
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_DB: fiestas
                    POSTGRES_USER: fiestas
                    POSTGRES_PASSWORD: fiestas
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U fiestas -d fiestas"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DATABASE_URL: postgres://fiestas:fiestas@localhost:5432/fiestas

        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: '22'
                  cache: npm
                  cache-dependency-path: backend/package-lock.json
            - run: npm ci
            - run: npx tsc --noEmit
            - name: Apply schema
              run: psql -v ON_ERROR_STOP=1 "$DATABASE_URL" -f migrations/001_create_events.sql
            - run: npm test

    deploy:
        needs: test
        runs-on: ubuntu-latest
        steps:
            # Faltando un secret no se puede desplegar, así que el job para en
            # rojo. Saltárselo en verde escondería que el VPS sigue con la
            # versión anterior.
            - name: Check deploy configuration
              run: |
                  missing=
                  [ -n "${{ secrets.DEPLOY_HOST }}" ] || missing="$missing DEPLOY_HOST"
                  [ -n "${{ secrets.DEPLOY_USER }}" ] || missing="$missing DEPLOY_USER"
                  [ -n "${{ secrets.DEPLOY_SSH_KEY }}" ] || missing="$missing DEPLOY_SSH_KEY"
                  if [ -n "$missing" ]; then
                      echo "::error::Faltan secrets del despliegue:$missing (ver docs/deploy.md §6)"
                      exit 1
                  fi

            - name: Deploy over SSH
              uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DEPLOY_HOST }}
                  username: ${{ secrets.DEPLOY_USER }}
                  key: ${{ secrets.DEPLOY_SSH_KEY }}
                  script: |
                      set -euo pipefail
                      cd /opt/logro-fiestas
                      git fetch origin main
                      git reset --hard origin/main
                      C="docker compose --env-file .env.prod -f docker-compose.prod.yml"
                      $C up -d --build --remove-orphans
                      # El esquema es todo CREATE ... IF NOT EXISTS: se puede reaplicar.
                      $C exec -T database psql -v ON_ERROR_STOP=1 -U fiestas -d fiestas \
                        < backend/migrations/001_create_events.sql
                      docker image prune -f
